<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <p>
            <label for="nasc">Ano de Nascimento:</label>
            <input type="number" name="nasc" id="nasc">
        </p>
        <p>
            Sexo:
            <input type="radio" name="sex" id="mas" checked>
            <label for="mas">Masculino</label>
            <input type="radio" name="sex" id="fem">
            <label for="fem">Feminino</label>
        </p>
        <p>
            <input type="button" value="Verificar" onclick="veri()">
        </p>
        <div id="resu">Preencha os dados acima oara ver o resultado.</div>
    </section>
    <footer>
        <p>&copy;Juliano-A-Magalhães</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
