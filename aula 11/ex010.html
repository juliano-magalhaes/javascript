<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    <p>
        <label for="txtvel">Velocidade do veiculo</label>
        <input type="number" name="txtvel" id="txtvel"> Km/h
    </p>
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>

    <script>
        var txtv = document.querySelector('input#txtvel')
        var res = document.querySelector('div#res')
        var vel = Number(txtv.value)
        

        function calcular() {
            res.innerHTML = `<P>Sua velocidade é de ${vel}Km/h</p>`
                if (vel > 60) {
                    res.innerHTML = '<p>Você está MULTADO por ultapassar o limite de velocidade'
                }
            res.innerHTML += `<p>Dirija sempre com cinto de segurança</p>`
        }
    </script>
</body>
</html>
