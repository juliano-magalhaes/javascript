<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-size: 20pt;
        }
    </style>
</head>
<body>

    <script>
        var nome = prompt('Qual é o seu nome?')
        document.write(`Olá, ${nome}, o seu nome tem ${nome.length} caracteres`)
        document.write(`Seu nome escrito tudo em letras maiusculas fica assim: ${nome.toUpperCase()}`)
        document.write(`Seu nome todo em letras minusculas fica assim: ${nome.toLowerCase()}`)
    </script>
</body>
</html>
